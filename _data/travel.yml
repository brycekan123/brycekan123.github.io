# Pins for the /travel/ globe page (_pages/travel.md + assets/js/travel-globe.js).
# Add a place by copying an entry. Use city or park coordinates, never a photo's GPS.
# color: the place's pin, chip and route-line color as "#rrggbb" (baby blue if left out).
#        color2 (optional) is a second flag color for the pin's inner border, like Tokyo's white.
# photo: a path under /assets/img/travel/ (strip the photo's metadata first). Leave it out for a small pin.
# photo_focus: the part of the photo the card keeps, as "x% y%" ("50% 100%" = bottom middle). Default "50% 50%".
# photo_zoom:  1.2 zooms in 20% around the focus. Default 1 (the photo just fills the card).
# date:  "YYYY", "YYYY-MM" or "YYYY-MM-DD" in quotes. Leave it empty until it's filled in.
#        The "Travel tour" visits dated places oldest first, then undated ones in file order.
#        date_label replaces the card's date text (e.g. "Since 2024 – Present"); date still sets the order.
# by:    how you got here from the previous stop on the tour: car, train or plane (plane if left out).
# current: true on where you live now. The page opens on it with a "Current location" tag on the globe.
# home:  true on the home base. back_home: car, train or plane on the last place of a trip makes the tour
#        stop briefly at home before the next trip (or end there after the last trip); leave it out to go
#        straight on (Tokyo, Nara, Hong Kong).

